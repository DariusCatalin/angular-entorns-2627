<!--Aquest fitxer conté la vista: estructura HTML i bindings {{}}-->

<div class="tarjeta">
    <h2> {{nom}} </h2>
    <p> Preu : {{preu}} €</p>
    <p> Estoc: {{estoc}} unitats</p>
    <p> Preu amb iva (21%): {{preu * 1.21}}</p>
    <p> {{estoc > 0 ? 'Disponible' : 'Esgotat'}}</p>
    <p> Nom en majúscules: {{nom.toUpperCase()}}</p>
</div>
